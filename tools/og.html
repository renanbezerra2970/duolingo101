<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #131f24; color: #f1f7fb; font-family: Nunito, sans-serif; font-weight: 800; position: relative; }
  .glow { position: absolute; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(88,204,2,.22), transparent 65%); left: -220px; top: -180px; }
  .glow2 { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(28,176,246,.16), transparent 65%); right: -160px; bottom: -260px; }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .logo { display: flex; align-items: center; gap: 22px; }
  .logo img { width: 112px; height: 112px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
  h1 { font-size: 76px; font-weight: 900; letter-spacing: -2px; line-height: 1; color: #58cc02; }
  h1 span { color: #f1f7fb; }
  .tag { font-size: 34px; margin-top: 30px; line-height: 1.25; }
  .tag b { color: #1cb0f6; }
  .chips { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
  .chip { border: 3px solid #37464f; border-radius: 999px; padding: 8px 16px; font-size: 20px; white-space: nowrap; color: #c8d6dd; }
  .right { position: absolute; right: 64px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .bar { height: 18px; border-radius: 99px; background: #37464f; margin: 0 0 30px 76px; overflow: hidden; } .bar div { width: 62%; height: 100%; background: #58cc02; border-radius: 99px; }
  .line { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .av { font-size: 50px; width: 62px; text-align: center; }
  .bub { border: 3px solid #37464f; border-radius: 20px; padding: 14px 20px; font-size: 27px; display: flex; gap: 12px; align-items: center; background: #131f24; }
  .bub svg { width: 32px; height: 32px; color: #1cb0f6; flex: none; }
  .bub u { text-decoration: none; border-bottom: 3px dashed #52656d; }
  .q { border: 3px solid #58cc02; border-radius: 20px; padding: 18px 22px; background: rgba(88,204,2,.08); margin-top: 6px; }
  .q h3 { font-size: 25px; font-weight: 900; margin-bottom: 12px; }
  .opt { display: flex; align-items: center; gap: 14px; font-size: 23px; margin-top: 8px; color: #c8d6dd; }
  .box { width: 36px; height: 36px; border: 3px solid #37464f; border-radius: 10px; display: grid; place-items: center; font-size: 20px; }
  .opt.ok { color: #58cc02; } .opt.ok .box { background: #58cc02; border-color: #58cc02; color: #fff; }
</style></head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="left">
    <div class="logo"><img src="../icons/icon.svg"><h1>duolingo<br><span>101</span></h1></div>
    <p class="tag">Histórias em inglês com <b>áudio</b> em cada frase e palavra</p>
    <div class="chips"><span class="chip">💬 diálogos</span><span class="chip">🎧 áudio nativo</span><span class="chip">✅ desafios</span></div>
  </div>
  <div class="right"><div class="bar"><div></div></div>
    <div class="line"><div class="av">👩🏽</div><div class="bub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span><u>Hello!</u> <u>Tea</u> <u>or</u> <u>coffee?</u></span></div></div>
    <div class="line"><div class="av">👨🏻</div><div class="bub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span><u>Coffee,</u> <u>please!</u></span></div></div>
    <div class="q"><h3>O que o Leo quer?</h3>
      <div class="opt"><span class="box">1</span>Chá com leite.</div>
      <div class="opt ok"><span class="box">✓</span>Café.</div>
    </div>
  </div>
</body></html>
